name: Release macOS and Windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.3.2)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        run: |
          VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' platforms/windows/ChirpOS/ChirpOS.csproj)
          test "$RELEASE_TAG" = "v$VERSION"
          test -f "docs/releases/$RELEASE_TAG.md"
      - name: Test and build all platforms
        run: |
          bash scripts/test.sh
          bash scripts/build.sh
          bash scripts/build-windows.sh win-arm64 win-x64
          VERSION=${RELEASE_TAG#v}
          ARCH=$(uname -m)
          ditto -c -k --keepParent dist/ChirpOS.app "dist/releases/ChirpOS-$VERSION-macOS-$ARCH.zip"
      - name: Publish one combined release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/releases
          VERSION=${RELEASE_TAG#v}
          shasum -a 256 ChirpOS-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ChirpOS $RELEASE_TAG · macOS & Windows" \
            --notes-file "$GITHUB_WORKSPACE/docs/releases/$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ChirpOS-* SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
